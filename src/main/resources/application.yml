spring:
  application:
    name: mini-bank
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USER:bank_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
      connection-init-sql: "ALTER SESSION SET CURRENT_SCHEMA=${DB_SCHEMA:BANK_OWNER}"
  flyway:
    user: ${DB_MIGRATION_USER:bank_owner}
    password: ${DB_MIGRATION_PASSWORD}
    default-schema: ${DB_SCHEMA:BANK_OWNER}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:BANK_OWNER}
        jdbc:
          time_zone: UTC
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
logging:
  level:
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
